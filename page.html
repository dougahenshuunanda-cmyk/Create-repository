<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サンプルページ</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --text:#e6edf3; --muted:#8b949e;
    --border:#2a313c; --accent:#58a6ff;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6f8; --panel:#ffffff; --text:#1b1f24; --muted:#5b6572; --border:#d7dce2; --accent:#1465c0; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    max-width:560px;width:100%;background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,.2);
  }
  h1{margin:0 0 8px;font-size:24px;}
  p{color:var(--muted);line-height:1.7;margin:0 0 20px;}
  .btn{
    display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
    padding:10px 20px;border-radius:8px;font-weight:700;font-size:14px;
  }
  ul{color:var(--muted);line-height:1.8;padding-left:20px;}
</style>
</head>
<body>
  <div class="card">
    <h1>サンプルWebページ</h1>
    <p>これはこのリポジトリに追加したシンプルなHTMLページです。自由に内容を書き換えてご利用ください。</p>
    <ul>
      <li>レスポンシブ対応済み</li>
      <li>ダーク/ライトモード自動切替</li>
      <li>外部ライブラリ不要の単一HTMLファイル</li>
    </ul>
    <a class="btn" href="index.html">鉄道運行マップを見る →</a>
  </div>
</body>
</html>
