<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>まるや接骨院 オープニング</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0c2630;--blue:#2fa8d8;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;overflow:hidden}
.scene{position:relative;width:100vw;height:100vh;height:100svh;overflow:hidden;background:#fff}
.bg{position:absolute;inset:-10%;background:url(assets/opening/poster.jpg) center/cover;filter:brightness(1.08) saturate(.85);animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.05) translateX(4%)}to{transform:scale(1.15) translateX(-4%)}}
.scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(1.08) saturate(.85)}
/* 最初は真っ白 → 雲が見えてくる */
.whiteout{position:absolute;inset:0;background:#fff;animation:clear 2.2s ease forwards}
@keyframes clear{0%{opacity:1}100%{opacity:0}}
/* 文字の後ろだけ白くかすませて読みやすく */
.haze{position:absolute;inset:0;background:radial-gradient(ellipse 55% 45% at 50% 66%,rgba(255,255,255,.85),rgba(255,255,255,.4) 55%,transparent 80%)}
.copy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  font-family:"M PLUS Rounded 1c",sans-serif;padding:32vh 16px 0}
.eyebrow{color:var(--blue);font-weight:800;font-size:clamp(12px,1.4vw,18px);letter-spacing:.3em;margin-bottom:2.2vw}
h1{margin:0;line-height:1.3;font-size:clamp(38px,7vw,104px);letter-spacing:.04em}
h1 .l1{display:block;color:var(--navy);font-weight:500}
h1 .l2{display:block;color:var(--blue);font-weight:800}
.mist{opacity:0;filter:blur(18px);transform:scale(1.06);letter-spacing:.25em;animation:mistIn 1.8s cubic-bezier(.2,.7,.2,1) forwards}
.eyebrow.mist{animation-delay:1.2s}
.l1.mist{animation-delay:1.6s}
.l2.mist{animation-delay:2.2s}
@keyframes mistIn{to{opacity:1;filter:blur(0);transform:scale(1);letter-spacing:.04em}}
.eyebrow.mist{animation-name:mistInEb}
@keyframes mistInEb{to{opacity:1;filter:blur(0);transform:scale(1);letter-spacing:.3em}}
.fs{position:absolute;right:140px;bottom:16px;z-index:5;font:13px sans-serif;background:rgba(12,38,48,.75);color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.replay{z-index:5;position:absolute;right:16px;bottom:16px;font:13px sans-serif;background:rgba(12,38,48,.75);color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.skip{z-index:5;position:absolute;left:16px;bottom:16px;font:13px sans-serif;background:rgba(12,38,48,.55);color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
/* ---- 雲を突き抜ける ---- */
.s1{position:absolute;inset:0;transform-origin:50% 50%;animation:punch 1.1s cubic-bezier(.55,0,.9,.4) forwards 5s}
@keyframes punch{0%{transform:scale(1);filter:blur(0)}100%{transform:scale(3.2);filter:blur(10px)}}
.flash{position:absolute;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none;animation:flash 1.1s ease forwards 5.1s}
@keyframes flash{0%{opacity:0}55%{opacity:1}72%{opacity:1}100%{opacity:0}}
/* ---- シーン②：雲が晴れて富士山 ---- */
.s2{position:absolute;inset:0;overflow:hidden;opacity:0;animation:show .01s linear forwards 5.85s}
@keyframes show{to{opacity:1}}
.s2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right 45%;
  transform-origin:100% 55%;transform:scale(1.4);filter:blur(6px);
  animation:descend 2.4s cubic-bezier(.15,.75,.25,1) forwards 5.85s, slowZoom 12s ease-out forwards 8.25s}
@keyframes descend{to{transform:scale(1);filter:blur(0)}}
@keyframes slowZoom{from{transform:scale(1)}to{transform:scale(1.05)}}
.s2::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,79,110,.28),transparent 48%)}
/* 左右に晴れていく雲 */
.cl{position:absolute;inset:-10%;z-index:1;background:url(assets/opening/poster.jpg) center/cover;filter:brightness(1.04) saturate(.7);pointer-events:none}
.cl.l{-webkit-mask-image:linear-gradient(90deg,#000 35%,transparent 62%);mask-image:linear-gradient(90deg,#000 35%,transparent 62%);
  animation:partL 2.6s cubic-bezier(.5,.05,.3,1) forwards 5.85s}
.cl.r{-webkit-mask-image:linear-gradient(270deg,#000 35%,transparent 62%);mask-image:linear-gradient(270deg,#000 35%,transparent 62%);
  animation:partR 2.6s cubic-bezier(.5,.05,.3,1) forwards 5.85s}
@keyframes partL{0%{transform:translateX(0) scale(1.2);opacity:1}60%{opacity:.85}100%{transform:translateX(-80%) scale(1.7);opacity:0}}
@keyframes partR{0%{transform:translateX(0) scale(1.2);opacity:1}60%{opacity:.85}100%{transform:translateX(80%) scale(1.7);opacity:0}}
.s2 .catch{position:absolute;z-index:2;left:6vw;top:30%;margin:0;
  font-family:"Shippori Mincho B1","Yu Mincho","Hiragino Mincho ProN",serif;font-weight:800;color:#fff;
  font-size:clamp(32px,5.4vw,82px);line-height:1.3;letter-spacing:.12em;
  text-shadow:0 2px 18px rgba(10,40,60,.45),0 1px 3px rgba(10,40,60,.35)}
.s2 .catch .ch{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(18px);animation:chIn .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes chIn{to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes mistIn2{to{opacity:1;filter:blur(0);transform:scale(1);letter-spacing:.06em}}
/* 桜の花びら */
.petal{position:absolute;z-index:1;top:-5%;width:12px;height:9px;background:#fbd3df;border-radius:60% 0 60% 0;opacity:0;
  animation:fall linear infinite}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.9}100%{opacity:0;transform:translate(-18vw,110vh) rotate(540deg)}}
/* ---- ホームページへの引き継ぎフェード ---- */
.handoff{position:absolute;inset:0;z-index:6;background:#fff;opacity:0;pointer-events:none;animation:handoffFade 1s ease forwards 10.6s}
@keyframes handoffFade{to{opacity:1}}
@media (max-width:760px){.s2 img{object-position:22% 40%}.s2 .catch{top:18%}}
@media (prefers-reduced-motion:reduce){.s1,.flash,.cl{display:none}.s2,.s2 img{animation:none;opacity:1;transform:none;filter:none}.mist,.whiteout{animation:none;opacity:1;filter:none;transform:none}.whiteout{opacity:0}}
</style>
<div class="scene" id="scene">
  <div class="s1">
  <div class="bg"></div>
  <video id="v" src="assets/opening/cloud.mp4" poster="assets/opening/poster.jpg" autoplay muted loop playsinline preload="auto"></video>
  <div class="haze"></div>
  <div class="whiteout"></div>
  <div class="copy">
    <div class="eyebrow mist">山梨県富士吉田市 / まるや接骨院</div>
    <h1><span class="l1 mist">老若男女に</span><span class="l2 mist">愛される接骨院</span></h1>
  </div>
  </div>
  <div class="s2">
    <img src="assets/opening/fuji_v2.jpg" alt="富士山と新倉山浅間公園の五重塔">
    <div class="cl l"></div><div class="cl r"></div>
    <p class="catch" id="catch">この富士吉田市で</p>
    <i class="petal" style="left:70%;animation-duration:9s;animation-delay:8.2s"></i>
    <i class="petal" style="left:85%;animation-duration:11s;animation-delay:9s;transform:scale(.8)"></i>
    <i class="petal" style="left:55%;animation-duration:10s;animation-delay:9.6s"></i>
    <i class="petal" style="left:95%;animation-duration:12s;animation-delay:8.6s"></i>
    <i class="petal" style="left:40%;animation-duration:13s;animation-delay:10s"></i>
  </div>
  <div class="flash"></div>
  <div class="handoff"></div>
  <button class="skip" onclick="goHome()">スキップ</button>
  <button class="fs" onclick="var d=document.documentElement;document.fullscreenElement?document.exitFullscreen():(d.requestFullscreen||d.webkitRequestFullscreen).call(d)">全画面</button>
  <button class="replay" onclick="replay()">もう一度見る</button>
</div>
<script>
function splitCatch(root){var el=root.querySelector('#catch');var s=el.textContent;el.textContent='';for(var i=0;i<s.length;i++){var c=document.createElement('span');c.className='ch';c.textContent=s[i];c.style.animationDelay=(7.8+i*0.18).toFixed(2)+'s';el.appendChild(c);}}
splitCatch(document);
function playV(v){v.muted=true;var p=v.play();if(p&&p.catch)p.catch(function(){});}
playV(document.getElementById('v'));
document.addEventListener('click',function(){playV(document.getElementById('v'));},{once:true});
function replay(){var s=document.getElementById('scene'),c=s.cloneNode(true);s.replaceWith(c);playV(c.querySelector('video'));clearTimeout(window._homeTimer);window._homeTimer=setTimeout(goHome,11000);}
function goHome(){window.location.href='maruya-sekkotsu.html';}
window._homeTimer=setTimeout(goHome,11000);
</script>

</body></html>
