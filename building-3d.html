<title>ひまわり鍼灸院 3Dモデル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one full-screen 3D stage; a title card top-left, view controls docked at the bottom. */
:root {
  --sky-top: #b9cfe0;
  --sky-bottom: #e9edea;
  --panel: rgba(250, 250, 246, 0.88);
  --fg: #23292b;
  --muted: #5b6668;
  --line: rgba(35, 41, 43, 0.16);
  --accent: #1f5f8b;
  --accent-fg: #ffffff;
  --predict: #2f6fe0;
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top: #131c26; --sky-bottom: #2b3438;
    --panel: rgba(24, 30, 33, 0.86); --fg: #e9ecea; --muted: #a3adae;
    --line: rgba(233, 236, 234, 0.18); --accent: #7fbbe6; --accent-fg: #0f1a22;
    --predict: #6ea0ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-top: #131c26; --sky-bottom: #2b3438;
  --panel: rgba(24, 30, 33, 0.86); --fg: #e9ecea; --muted: #a3adae;
  --line: rgba(233, 236, 234, 0.18); --accent: #7fbbe6; --accent-fg: #0f1a22;
  --predict: #6ea0ff; color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: linear-gradient(var(--sky-top), var(--sky-bottom));
  color: var(--fg);
  font-family: var(--font-display);
  overflow: hidden;
  position: relative;
}
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }

.card {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  max-width: min(330px, calc(100% - 32px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px 12px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.card h1 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.card .dims { margin: 4px 0 0; font-family: var(--font-data); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card details { margin-top: 8px; font-size: 13px; line-height: 1.6; }
.card summary { cursor: pointer; color: var(--accent); font-weight: 700; }
.card ul { margin: 6px 0 0; padding-left: 1.1em; }
.card li b { font-weight: 700; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--predict); margin-right: 4px; vertical-align: baseline; }

.dock {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding-block: 10px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none;
}
.row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; pointer-events: auto; }
.row button {
  font: 700 13px/1 var(--font-display);
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 10px 14px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.row button:hover { border-color: var(--accent); }
.row button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.spot {
  font: 700 13px/1 var(--font-display); color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px; min-width: 9.5em; text-align: center;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.hint { font-size: 12px; color: var(--fg); background: var(--panel); border-radius: 999px; padding: 4px 12px; margin: 0; pointer-events: none; text-align: center; }
#err { position: absolute; inset: 40% 16px auto; text-align: center; font-size: 14px; }
</style>

<canvas id="stage" aria-label="建物の3Dモデル。ドラッグで回転できます"></canvas>

<section class="card">
  <h1>ひまわり鍼灸院 3Dモデル</h1>
  <p class="dims">外壁 約13.9 × 22.7 m ・ 軒高 約2.9 m ・ 平屋</p>
  <details>
    <summary>写真から作った所 / 予測した所</summary>
    <ul>
      <li><b>写真どおり</b>：屋根の形（航空写真）、東面の窓・勝手口・室外機・看板、北西の角と給湯器</li>
      <li><span class="swatch"></span><b>予測</b>：南面、西面の奥の窓、北面の東寄り、玄関ドア</li>
      <li>壁・瓦・大きい窓の質感は実際の写真から切り出し</li>
      <li>寸法は航空写真の10mスケールから計算</li>
    </ul>
  </details>
</section>

<div class="dock">
  <div class="row" role="group" aria-label="モード">
    <button type="button" id="m-walk" aria-pressed="true">360°で歩く</button>
    <button type="button" id="m-orbit" aria-pressed="false">外から回す</button>
  </div>
  <div class="row" id="walk-row" role="group" aria-label="立つ場所">
    <button type="button" id="w-prev" aria-label="前の地点">◀</button>
    <span class="spot" id="w-name" aria-live="polite"></span>
    <button type="button" id="w-next" aria-label="次の地点">▶</button>
  </div>
  <div class="row" id="orbit-row" role="group" aria-label="視点" hidden>
    <button type="button" id="v-ne" data-view="ne">北東</button>
    <button type="button" id="v-e" data-view="e">東（駐車場）</button>
    <button type="button" id="v-nw" data-view="nw">北西</button>
    <button type="button" id="v-sw" data-view="sw">南西（予測）</button>
    <button type="button" id="v-top" data-view="top">真上</button>
  </div>
  <div class="row" role="group" aria-label="表示">
    <button type="button" id="t-predict" aria-pressed="false">予測部分を色分け</button>
    <button type="button" id="t-context" aria-pressed="true">周辺を表示</button>
  </div>
  <p class="hint" id="hint"></p>
</div>
<p id="err" hidden>3D表示を読み込めませんでした。通信環境を確認して再読み込みしてください。</p>

  const skyTex = canvasTex(1024, 512, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h * 0.55);
    gr.addColorStop(0, '#4f86c6'); gr.addColorStop(0.6, '#8fb6dc'); gr.addColorStop(1, '#cfdde8');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 26; i++) {            // soft cloud banks, like the overcast-with-gaps sky in the photos
      const x = rnd() * w, y = h * (0.12 + rnd() * 0.3), r = 22 + rnd() * 50;
      const c = g.createRadialGradient(x, y, 0, x, y, r);
      c.addColorStop(0, 'rgba(255,255,255,0.6)'); c.addColorStop(1, 'rgba(255,255,255,0)');
      for (const ox of [-w, 0, w]) {            // repeat across the seam so the sky wraps cleanly
        g.save(); g.translate(x + ox, y); g.scale(2.4, 1);
        const c2 = g.createRadialGradient(0, 0, 0, 0, 0, r);
        c2.addColorStop(0, 'rgba(255,255,255,0.6)'); c2.addColorStop(1, 'rgba(255,255,255,0)');

    }

    for (let x = 0; x <= w; x += 16) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    g.lineWidth = 4;
    for (const y of [3, 22, 64, 106, 125]) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }

  const signTex = canvasTex(256, 200, (g, w, h) => {

  function markPredicted(obj) {
    obj.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); predicted.push(o.material); } });

  /* ---------- outlines (from the aerial photo, 33 px = 1 m) ---------- */
  const EAVE = [[0, 0], [15.3, 0], [15.3, 19.8], [13.2, 19.8], [13.2, 24.1], [4.5, 24.1], [4.5, 22.4], [0, 22.4]];
  const WALL = [[0.7, 0.7], [14.6, 0.7], [14.6, 19.1], [12.5, 19.1], [12.5, 23.4], [5.2, 23.4], [5.2, 21.7], [0.7, 21.7]];
  const WALL_H = 2.85, SOFFIT = 0.18, SLOPE = 0.3;
  const PREDICTED_WALLS = [3, 4, 5, 6];

  function edge(i) {
    const a = WALL[i], b = WALL[(i + 1) % WALL.length];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const d = [(b[0] - a[0]) / len, (b[1] - a[1]) / len];
    return { a, b, len, d, n: [d[1], -d[0]] };
  }
  // put an object (front = local +z) on wall edge i, t metres from the edge start
  function place(obj, i, t, y, out) {
    const e = edge(i); out = out || 0;
    obj.position.set(e.a[0] + e.d[0] * t + e.n[0] * out, y, e.a[1] + e.d[1] * t + e.n[1] * out);
    obj.rotation.y = Math.atan2(e.n[0], e.n[1]);
    world.add(obj);
    return obj;
  }

  /* ---------- walls + foundation ---------- */
  WALL.forEach((_, i) => {
    const e = edge(i);
    const quad = (y0, y1, out, mat, uv) => {
      const g = new T.BufferGeometry();
      const p = (t, y) => [e.a[0] + e.d[0] * t + e.n[0] * out, y, e.a[1] + e.d[1] * t + e.n[1] * out];
      g.setAttribute('position', new T.Float32BufferAttribute([...p(0, y0), ...p(e.len, y0), ...p(e.len, y1), ...p(0, y1)], 3));
      g.setAttribute('uv', new T.Float32BufferAttribute([0, y0 / 1.37, e.len / 1.37, y0 / 1.37, e.len / 1.37, y1 / 1.37, 0, y1 / 1.37], 2));
      g.setIndex([0, 2, 1, 0, 3, 2]); g.computeVertexNormals();
      const m = shadow(new T.Mesh(g, mat)); world.add(m); return m;
    };
    const w = quad(0, WALL_H, 0, M.wall);
    quad(0, 0.4, 0.02, M.base);
    if (PREDICTED_WALLS.includes(i)) markPredicted(w);
  });

  /* ---------- eave slab (white soffit + fascia) ---------- */
  function shapeOf(poly) {
    const s = new T.Shape();
    poly.forEach((p, i) => i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1]));
    s.closePath(); return s;
  }
  const soffit = shadow(new T.Mesh(new T.ExtrudeGeometry(shapeOf(EAVE), { depth: SOFFIT, bevelEnabled: false }), M.white));
  soffit.rotation.x = Math.PI / 2; soffit.position.y = WALL_H + SOFFIT;
  world.add(soffit);

  /* ---------- hip roof: height = slope × distance to the eave line ---------- */
  (function buildRoof() {
    const inside = (x, z) => {
      let c = false;

  document.getElementById('m-walk').addEventListener('click', () => { setMode('walk'); goSpot(walk.i, true); });
  document.getElementById('m-orbit').addEventListener('click', () => setMode('orbit'));
  document.getElementById('w-prev').addEventListener('click', () => goSpot(walk.i - 1, false));
  document.getElementById('w-next').addEventListener('click', () => goSpot(walk.i + 1, false));

  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    const v = VIEWS[b.dataset.view]; auto = false;
    let th = v[0]; while (th - cam.th > Math.PI) th -= 2 * Math.PI; while (th - cam.th < -Math.PI) th += 2 * Math.PI;
    goal = { th, ph: v[1], r: v[2] * rScale, tx: 0, tz: 0 };
  }));
  const tp = document.getElementById('t-predict'), tc = document.getElementById('t-context');
  tp.addEventListener('click', () => {
    const on = tp.getAttribute('aria-pressed') !== 'true'; tp.setAttribute('aria-pressed', on);
    predicted.forEach(m => { if (m.emissive) m.emissive.setHex(on ? 0x1d4fc4 : 0x000000); });
  });
  tc.addEventListener('click', () => {
    const on = tc.getAttribute('aria-pressed') !== 'true'; tc.setAttribute('aria-pressed', on); context.visible = on;
  });

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = mode === 'walk' ? walk.fov : (w < h ? 58 : 40);   // orbit: wider lens on a portrait phone so the whole building fits
    camera.updateProjectionMatrix();
    const k = w < h * 0.8 ? 1.55 : 1;
    cam.r *= k / rScale; rScale = k;
  }
  window.addEventListener('resize', resize);
  goSpot(0, true); setMode('walk');

  (function loop() {
    requestAnimationFrame(loop);
    if (goal) {
      let done = true;
      for (const k in goal) { const d = goal[k] - cam[k]; cam[k] += d * 0.12; if (Math.abs(d) > 0.002) done = false; }
      if (done) goal = null;
    }
    if (mode === 'walk') {
      if (walk.from) {                       // 0.45 s ease between spots
        const u = Math.min(1, (performance.now() - walk.t0) / 450), e = u * u * (3 - 2 * u);
        for (const k of ['x', 'y', 'z', 'yaw']) walk[k] = walk.from[k] + (walk['g' + k] - walk.from[k]) * e;
        if (u >= 1) walk.from = null;
      }
    }
    applyCamera();
    renderer.render(scene, camera);
  })();
})();
</script>
